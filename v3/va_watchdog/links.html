<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Web Links</title><style>
:root{color-scheme:light;--ink:#182c32;--muted:#52696d;--line:#d9e2dd;--bg:#f3f5ef;--teal:#166859;--red:#a22c35}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:1080px;margin:auto;padding:30px 30px 60px}header,.section-head{display:flex;align-items:center;justify-content:space-between;gap:18px}header{padding-bottom:25px;border-bottom:1px solid var(--line)}.brand{font-size:13px;font-weight:750;letter-spacing:.13em;text-transform:uppercase}.brand span{color:var(--teal);padding-left:12px;border-left:1px solid var(--line);margin-left:12px}nav{display:flex;gap:15px;flex-wrap:wrap}a{color:var(--teal);text-underline-offset:4px}.intro{padding:32px 0 18px}.eyebrow,.label{color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-size:11px;font-weight:700}h1{font-size:38px;line-height:1.15;letter-spacing:-.035em;margin:8px 0}h2{font-size:19px;margin:0}.muted{color:var(--muted);font-size:13px}.launchers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}.launcher,.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px}.launcher{display:block;text-decoration:none;color:var(--ink);min-height:120px}.launcher:hover{border-color:var(--teal);background:#f8fbf8}.launcher strong{display:block;font-size:18px;color:var(--teal)}.launcher span{display:block;color:var(--muted);font-size:12px;margin-top:8px;overflow-wrap:anywhere}.card{margin-top:16px}.edit-grid{display:grid;grid-template-columns:1fr 1.6fr .6fr auto;gap:10px;align-items:end}.editor{padding:14px 0;border-top:1px solid var(--line)}.editor:first-child{border-top:0}label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}input,select,button{font:inherit;border:1px solid #bdcdc4;background:#fff;padding:9px;border-radius:7px;color:var(--ink);width:100%}button{font-weight:700;color:var(--teal);cursor:pointer;width:auto}.danger{color:var(--red)}.actions{display:flex;gap:7px}.empty{padding:24px;text-align:center;color:var(--muted)}@media(max-width:800px){.launchers{grid-template-columns:repeat(2,1fr)}.edit-grid{grid-template-columns:1fr}.actions{justify-content:flex-start}}@media(max-width:550px){main{padding:18px 16px}.launchers{grid-template-columns:1fr}header{align-items:flex-start}.brand span{display:block;border:0;padding:0;margin:3px 0}h1{font-size:30px}}
</style></head><body><main><header><div class="brand">VA-Connect<span>Web links</span></div><nav><a href="/">Status</a><a href="/crossing-activity">Crossing activity</a><a href="/maintenance">Maintenance</a></nav></header>
<section class="intro"><div class="eyebrow">Local devices</div><h1>Web links</h1><p class="muted">Open the mobile router, cameras and other saved device pages on this gateway's network.</p></section>
<section><div class="section-head"><h2>Open a device</h2><a href="/advanced/links">Engineering detail</a></div><div class="launchers" id="launchers"><div class="empty">Loading saved links…</div></div></section>
<section class="card"><h2>Manage links</h2><p class="muted">Credentials are not stored in these links.</p><div id="editors"></div><form class="editor edit-grid" method="post" action="/web-link-add"><div><label>Name</label><input name="name" maxlength="80" required placeholder="e.g. Mobile router"></div><div><label>IP address or URL</label><input name="url" maxlength="512" required placeholder="e.g. 192.168.1.1"></div><div><label>Type</label><select name="group"><option value="rut">RUT</option><option value="camera">Camera</option><option value="other">Other</option></select></div><div class="actions"><button type="submit">Add link</button></div></form></section>
</main><script>
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('/api/web-links',{cache:'no-store'}).then(r=>r.json()).then(d=>{const links=d.links||[];document.getElementById('launchers').innerHTML=links.length?links.map(x=>`<a class="launcher" href="${esc(x.url)}" target="_blank" rel="noopener"><strong>${esc(x.name)}</strong><span>${esc(x.group.toUpperCase())}</span><span>${esc(x.url)}</span></a>`).join(''):'<div class="empty">No web links have been saved yet.</div>';document.getElementById('editors').innerHTML=links.map((x,i)=>`<form class="editor edit-grid" method="post" action="/web-link-update"><input type="hidden" name="index" value="${i}"><div><label>Name</label><input name="name" maxlength="80" required value="${esc(x.name)}"></div><div><label>IP address or URL</label><input name="url" maxlength="512" required value="${esc(x.url)}"></div><div><label>Type</label><select name="group">${['rut','camera','other'].map(g=>`<option value="${g}" ${g===x.group?'selected':''}>${g==='rut'?'RUT':g[0].toUpperCase()+g.slice(1)}</option>`).join('')}</select></div><div class="actions"><button type="submit">Save</button><button class="danger" type="submit" formaction="/web-link-delete" formnovalidate>Delete</button></div></form>`).join('')}).catch(()=>{document.getElementById('launchers').innerHTML='<div class="empty">Saved links could not be loaded.</div>'});
</script></body></html>
